name: Test

# Vercel builds and publishes the app on its own (vercel.json, which runs the app
# tests and the leak check before anything goes live). This checks every push and
# pull request, the Python pipeline included.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # The pipeline has no dependencies on purpose, so there is nothing to install.
      - name: Pipeline tests
        run: python3 -m unittest discover -s scripts/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Types
        run: npx tsc -b --noEmit
        working-directory: app

      - name: App tests
        run: npm test
        working-directory: app
