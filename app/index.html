<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Outreach</title>
<style>
  /* Light is the base. Dark overrides only the tokens, twice: once for the OS
     preference (skipped when the toggle has forced light) and once for the
     toggle itself, so the button wins in both directions. */
  :root{
    --bg-a:#dfe9f2; --bg-b:#f4ece2;
    --ink:#12140f; --dim:#5d6154; --line:rgba(18,20,15,.13);
    --card:rgba(255,255,255,.72); --surface:#fff; --soft:rgba(255,255,255,.6);
    --sunk:rgba(18,20,15,.06); --row:rgba(255,255,255,.45);

    --stop-bg:rgba(255,238,236,.9); --stop-line:rgba(141,58,52,.3);

      --ink:#e9e6df; --dim:#989c93; --line:rgba(233,230,223,.16);
      --card:rgba(255,255,255,.055); --surface:rgba(255,255,255,.09); --soft:rgba(255,255,255,.05);
      --sunk:rgba(0,0,0,.28); --row:rgba(255,255,255,.045);
      --go:#79b592; --go-ink:#0e1512; --warn:#d9a05f; --red:#e0908a;
      --warn-bg:rgba(217,160,95,.1); --warn-line:rgba(217,160,95,.32);
      --stop-bg:rgba(224,144,138,.1); --stop-line:rgba(224,144,138,.3);
      --hot-bg:rgba(217,160,95,.07); --hot-line:rgba(217,160,95,.4);
      --p1:#79b592; --p2:#7fb0da; --p3:#d9a05f;
      --tag-bg:rgba(121,181,146,.16); --tag-man-bg:rgba(217,160,95,.16);
      --shadow:rgba(0,0,0,.4);

  :root[data-theme="dark"]{
    --bg-a:#14181a; --bg-b:#1b1815;
    --ink:#e9e6df; --dim:#989c93; --line:rgba(233,230,223,.16);
    --card:rgba(255,255,255,.055); --surface:rgba(255,255,255,.09); --soft:rgba(255,255,255,.05);
    --sunk:rgba(0,0,0,.28); --row:rgba(255,255,255,.045);
    --go:#79b592; --go-ink:#0e1512; --warn:#d9a05f; --red:#e0908a;
    --warn-bg:rgba(217,160,95,.1); --warn-line:rgba(217,160,95,.32);
    --stop-bg:rgba(224,144,138,.1); --stop-line:rgba(224,144,138,.3);
    --hot-bg:rgba(217,160,95,.07); --hot-line:rgba(217,160,95,.4);
    --p1:#79b592; --p2:#7fb0da; --p3:#d9a05f;
    --tag-bg:rgba(121,181,146,.16); --tag-man-bg:rgba(217,160,95,.16);

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font:16px/1.55 ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",sans-serif;
    background:linear-gradient(170deg,var(--bg-a),var(--bg-b));background-attachment:fixed;min-height:100dvh}
  #root{max-width:680px;margin:0 auto;padding:22px 16px 90px;min-height:100dvh;display:flex;flex-direction:column}
  h1{font-size:26px;margin:0 0 2px;letter-spacing:-.02em;font-weight:650}
  h2{font-size:18px;margin:26px 0 10px;letter-spacing:-.01em;font-weight:640}
  h3{font-size:15px;margin:0 0 6px;font-weight:640}
  p{margin:0 0 11px}
  .dim{color:var(--dim)} .sm{font-size:13.5px}
  .xs{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:650}
  .card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);
    border-radius:18px;padding:18px;margin-bottom:12px}
  .card.hot{border-color:var(--hot-line);background:var(--hot-bg)}
  button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);padding:11px 15px;
    background:var(--surface);color:var(--ink);font-weight:560;transition:transform .08s}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.4;cursor:default}
  button.go{background:var(--go);color:var(--go-ink);border-color:transparent;width:100%;font-size:16px;padding:14px;font-weight:620}
  button.ghost{background:transparent;border-color:transparent;color:var(--dim);padding:8px 10px}
  button.copy{width:100%;font-size:16px;padding:14px;background:var(--surface)}
  button.copy.done{background:var(--go);color:var(--go-ink);border-color:transparent}
  button.sel{background:var(--ink);color:var(--bg-a);border-color:transparent}
  button.tiny{font-size:12.5px;padding:6px 11px;border-radius:9px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row.eq>*{flex:1;min-width:110px}
  a{color:var(--go);font-weight:560}
  .fact{background:var(--soft);border-left:3px solid var(--go);padding:11px 13px;
    border-radius:0 11px 11px 0;margin:11px 0;font-size:14px}
  .fact.none{border-left-color:var(--warn)}
  pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.6 ui-monospace,Menlo,monospace;
    background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px;margin:0 0 10px;max-height:340px;overflow:auto}
  .pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid currentColor;font-weight:600;white-space:nowrap}
  .t1{color:var(--p1)}.t2{color:var(--p2)}.t3{color:var(--p3)}.tu{color:var(--dim)}
  .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .chk:last-child{border-bottom:none}

  .box.on{background:var(--go);border-color:transparent;color:var(--go-ink)}
  .chk.on .ct{opacity:.42;text-decoration:line-through}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg-a);

  .toast.on{opacity:1}
  .tabs{display:flex;gap:5px;margin:14px 0 18px;background:var(--sunk);padding:4px;border-radius:14px}

     padding:8px 5px;border-bottom:1px solid var(--line);font-weight:650}

<body>

<!-- Real data first. It is gitignored, so on a public clone this 404s and the
     example set below fills in - data.example.js only assigns if SEED is unset. -->
<script src="data.js" onerror="this.dataset.missing=1"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-type="module">
const {useState, useEffect, useMemo, useRef} = React;
if (!window.SEED) window.SEED = {generated:"-", counts:{people:0,researched:0,named:0,companies:0,unworked:0}, people:[]};

/* ============================ constants ============================ */

const FROM = (window.SEED && window.SEED.from) || "you@example.com";
const SIG  = "\n\nMatt\ngithub.com/matthlh";
const JVISA = "I'm a Canadian citizen. UBC Science Co-op sponsors the J-1 through Cultural Vistas - the company files a DS-7002 and the visa is issued at the border. No lottery, no sponsorship cost.";

const TIER = {tier_1_canada:["Canada","t1"], tier_2_remote:["Remote US","t2"],
              tier_3_us_onsite:["US onsite","t3"], unknown:["?","tu"]};

/* Status is a position in the funnel. The app derives the next action from it,
   so every value here has to imply exactly one thing to do next. */
const STATUSES = ["not contacted","applied","messaged","replied","call booked","call done","built it","dead"];
const CHANNELS = {email:"Email", linkedin:"LinkedIn", form:"Form / ATS"};
const FOLLOWUP_DAYS = 7;

const T = {
  1: (c={}) => ({n:"1", name:"LinkedIn note", limit:300,
    note:"300 character limit. LinkedIn silently truncates past it.",
    text:`Hi ${c.first||"[Name]"} - CS student at UBC, saw you're on ${c.team||"[team/product]"} at ${c.company||"[Company]"}. I've been building LLM retrieval systems and read ${c.fact||"[specific thing]"}. Would value 15 min on how your team approaches ${c.topic||"[topic]"}. Happy to work around your schedule.`.slice(0,300)}),

  "1a": (c={}) => ({n:"1 alum", name:"LinkedIn note - alum", limit:300,
    note:"300 char limit. Use this whenever they went to UBC. Highest reply rate you have.",
    text:`Hi ${c.first||"[Name]"} - fellow UBC grad, third-year CS. Saw ${c.fact||"[specific thing]"} at ${c.company||"[Company]"}. I build LLM retrieval and eval systems. Would love 15 min on how you got from UBC into ${c.company||"[Company]"}. No ask beyond that.`.slice(0,300)}),

  2: (c={}) => ({n:"2", name:"Cold email - you applied", subject:`Applied for ${c.role||"the internship"} - one question`,
    note:"Apply FIRST, same day. The application is what makes this ask small.",
    text:`Hi ${c.first||"there"},

I applied for the ${c.role||"[role]"} internship yesterday. I'm a third-year CS student at UBC.

I noticed ${c.fact||"[specific fact - the blog post, the repo, the changelog item]"} ${c.connect||"[One sentence on why it connects to what you've built.]"}

Most of my work is LLM application engineering - at my last internship I built a semantic-retrieval ticket assistant and benchmarked models against a cost budget before shipping it to production users.

Would you have 15 minutes in the next couple of weeks? I'd mainly want to know what your team looks for in interns.${c.visa?"\n\n"+JVISA:""}${SIG}`}),

  3: (c={}) => ({n:"3", name:"Cold email - no posted role", subject:"15 minutes - UBC CS student",
    note:"Ask for advice, never a job. It is the only thing a stranger can say yes to.",
    text:`Hi ${c.first||"there"},

Third-year CS at UBC. ${c.fact||"[one real specific fact about their work]"}

I build LLM application systems - retrieval, evals, agent orchestration. Last one was a semantic-retrieval ticket assistant I benchmarked against a token budget and shipped to production users at an enterprise platform.

I'm not asking about a role. I'd like 15 minutes on ${c.topic||"[the specific technical thing]"}, and what you'd want to see from someone trying to do this work well.${c.visa?"\n\n"+JVISA:""}${SIG}`}),

  4: (c={}) => ({n:"4", name:"Follow-up", subject:`Following up - ${c.company||"[Company]"}`,
    note:"Send once. Never twice. Two unanswered touches means dead.",
    text:`Hi ${c.first||"there"} - bumping this once in case it got buried. Still happy to work around your schedule, and no problem if the timing's bad.${SIG}`}),

  5: (c={}) => ({n:"5", name:"After the call", subject:"Thanks - and the thing you mentioned",
    note:"Within 24 hours. This is the message that converts. Do not skip it.",
    text:`Hi ${c.first||"there"},

Thanks for the time. To make sure I got it: you said the thing that would matter most is ${c.said||"[exactly what they said]"}.

I'm going to build that over the next two weeks and I'll send it your way when it's done.${SIG}`}),

  6: (c={}) => ({n:"6", name:"The return visit", subject:"Built the thing we talked about",
    note:"Two weeks later. Almost nobody sends this. Do NOT ask for the referral here.",
    text:`Hi ${c.first||"there"},

You said ${c.said||"[the thing]"}. I built it: ${c.link||"[link]"}.

${c.what||"[One sentence on what it does and one on what you measured.]"}

Two questions - does this look like what you meant, and is there anything you'd change before I put it in front of anyone else?${SIG}`}),

  7: (c={}) => ({n:"7", name:"Recruiter - warm only", subject:`Referred by ${c.eng||"[engineer]"} - ${c.role||"internship"}`,
    note:"Never cold. Only once you have an engineer's name to drop.",
    text:`Hi ${c.first||"there"},

${c.eng||"[Engineer's name]"} on the ${c.team||"[team]"} suggested I reach out. I'm a third-year CS student at UBC applying for ${c.role||"[role]"}, available ${c.dates||"[dates]"}.

Background: LLM application engineering, retrieval and evals. I've already applied through the portal under ${FROM}.

Work authorization: ${JVISA}

Is there anything else useful from my side?${SIG}`}),
};

const TREE = {
  start: {q:"Where are you with this person?", a:[
    ["Haven't contacted them yet","who"],
    ["Sent a message, no reply after 7+ days","t4"],
    ["We had a call","postcall"],
  ]},
  who: {q:"Who are they?", a:[["An engineer or founder","alum"],["A recruiter","recwarm"]]},
  recwarm: {q:"Do you have an engineer's name to drop?", a:[
    ["Yes, I've spoken to someone there","t7"],["No","stopRec"]]},
  alum: {q:"Did they go to UBC?", a:[["Yes, UBC alum","chanAlum"],["No / couldn't tell","role"]]},
  chanAlum: {q:"How are you reaching them?", a:[["LinkedIn","t1a"],["Email","role"]]},
  role: {q:"Is there a posted role you can apply to?", a:[
    ["Yes, and I've applied","t2"],["Yes, but I haven't applied yet","applyFirst"],["No posted role","chan3"]]},
  chan3: {q:"How are you reaching them?", a:[["Email","t3"],["LinkedIn","t1"]]},
  postcall: {q:"How long ago?", a:[
    ["Today or yesterday","t5"],
    ["About two weeks, and I built the thing","t6"],
    ["Two weeks, I didn't build it","stopBuild"]]},
};
const LEAF = {t1:"1",t1a:"1a",t2:"2",t3:"3",t4:"4",t5:"5",t6:"6",t7:"7"};
const STOP = {
  stopRec:{h:"Don't message this recruiter yet.",p:"Cold recruiters are hammered daily and a student message reads as noise. Get an engineer to talk to you first, then come back and use template 7 with their name in the first line."},
  applyFirst:{h:"Apply first. Same day.",p:"Three minutes, and it puts you in the system. It also makes the ask small: \"I applied for X, would value fifteen minutes.\" Message first and they will just say \"apply on our site\" and you've spent the contact."},
  stopBuild:{h:"Build it first.",p:"The return visit only works because you did the thing they told you to do. Without it you're just checking in, which is the message everyone ignores. Block 60 minutes this weekend, then come back."},
};

const ROPES = [
  ["Fix the resume typo","Your header says Github/mattthlh with three t's. It's a dead link on every application you've sent. Same typo in the Nost project link."],
  ["Send one message","Open Today, take the top card, hit copy, send it. One. The point is to break the seal, not to be good at it."],
  ["Send three, and mark them","Same flow. Mark each one sent so the 7-day follow-up clock starts. You're learning what a good specific fact looks like, which is the only skill here."],
  ["Do the UBC alum check on all three","LinkedIn, company page, People tab, filter School: UBC. Notice how much better an alum thread feels. Toggle Alum on the card and the template changes."],
  ["Find your own fact","Take a card with no researched fact. Open their repo, read the last few commits, pick one real thing. Five minutes. Do this until it feels fast."],
  ["Five quick-applies in 15 minutes","Volume tier. workatastartup.com and the GitHub Summer 2027 lists. No tailoring. Time yourself so you learn it's genuinely three minutes each."],
  ["First Sunday review","Open People, sort by Follow up. Anything 7+ days with no reply gets template 4, once. Count what you sent. Say the number out loud to a person."],
  ["Reply triage","By now something has come back. Mark it Replied. A no is data, not a failure. Two unanswered touches means dead, move on."],
  ["Ask question 3 on a call","\"If you were me, what would you build in the next month?\" That answer is the spec for template 6, which is where referrals actually come from."],
  ["Send template 5 within 24h","After any call. Repeat back exactly what they said. This is the message that converts and almost nobody sends it."],
  ["Build the thing","One weekend. Whatever they told you in question 3. It doesn't need to be big, it needs to exist."],
  ["Send template 6","Two weeks after the call. You said X, I built it, here's the link. Do not ask for the referral. Roughly half the time it's offered."],
  ["Steady state","You now know the loop. Five applies, one real message, one problem, every day. Never miss two days in a row."],
];

/* ============================ storage ============================ */

const KEY = "career.outreach.v1";
let STORAGE_OK = true;

function loadState(){
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : {p:{}, ropes:{}, log:[], target:2};
  } catch (e) {
    STORAGE_OK = false;
    return {p:{}, ropes:{}, log:[], target:2};
  }
}
function saveState(s){
  try { localStorage.setItem(KEY, JSON.stringify(s)); }
  catch (e) { STORAGE_OK = false; }
}

/* Theme lives in its own key so it does not travel in the outreach export -
   the machine you import onto has its own eyes. "auto" follows the OS. */
const THEME_KEY = "career.theme";
function loadTheme(){
  try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; }
}
function applyTheme(t){
  const root = document.documentElement;
  if (t === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#14181a" : "#dfe9f2");
}

/* ============================ dates ============================ */

const DAY = 86400000;
/* Local date, not UTC. toISOString() rolls over at 5pm Pacific, which would
   label a message sent tonight as sent yesterday. */
function today(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
         + "-" + String(d.getDate()).padStart(2,"0");
}
function daysSince(iso){
  if (!iso) return null;
  return Math.floor((Date.parse(today()) - Date.parse(iso)) / DAY);
}
function ago(iso){
  const d = daysSince(iso);
  if (d === null) return "";
  if (d === 0) return "today";
  if (d === 1) return "yesterday";
  return d + "d ago";
}

/* ============================ the action engine ============================

   One function decides what to do about a person. Everything else - the Today
   tab, the follow-up flag in People, the badge counts - reads from this, so
   there is exactly one place where the rules live.

   kind:  send | followup | thanks | build | return | wait | reply | none
   ------------------------------------------------------------------------ */

function nextAction(p, st){
  const s = (st && st.status) || "not contacted";
  const d = daysSince(st && st.last);

  if (s === "dead")        return {kind:"none", label:"Dead", why:"Two unanswered touches. Move on."};
  if (s === "built it")    return {kind:"return", tmpl:"6", label:"Send the return visit", why:"You built it. Now show them."};

  if (s === "call done"){
    if (d === 0)  return {kind:"thanks", tmpl:"5", label:"Send the thank-you", why:"Within 24 hours. This is the message that converts."};
    if (d < 14)   return {kind:"build", label:"Build the thing", why:"Day " + d + " of 14. Template 6 unlocks when you mark it built."};
    return {kind:"build", label:"Overdue: build the thing", why:"It's been " + d + " days. The return visit only works if the thing exists."};
  }
  if (s === "call booked") return {kind:"wait", label:"Call booked", why:"Nothing to send until after it."};
  if (s === "replied")     return {kind:"reply", label:"They replied - answer it", why:"Reply in your inbox, then mark the call booked."};

  if (s === "messaged"){
    const ups = (st && st.ups) || 0;
    if (d < FOLLOWUP_DAYS) return {kind:"wait", label:"Sent " + ago(st.last), why:"Follow up on day " + FOLLOWUP_DAYS + ", not before."};
    if (ups === 0)         return {kind:"followup", tmpl:"4", label:"Follow up", why:d + " days, no reply. Send template 4 once."};
    return {kind:"none", label:"Mark dead", why:"Two unanswered touches. That's the rule.", dead:true};
  }
  if (s === "applied")     return {kind:"send", tmpl:"2", label:"Message a human there", why:"You applied. Now make it a conversation."};

  /* not contacted */
  if (p.applyUrl)          return {kind:"send", tmpl:"2", apply:true, label:"Apply, then message", why:"Apply first. It makes the ask small."};
  return {kind:"send", tmpl:"3", label:"First message", why:"No posted role. Ask for fifteen minutes of advice."};
}

/* ============================ helpers ============================ */

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("on"), 1500);
}
function copy(text, msg){
  navigator.clipboard.writeText(text).then(
    () => toast(msg || "Copied"),
    () => toast("Copy failed - select the text instead")
  );
}
function gmailUrl(to, subject, body){
  return "https://mail.google.com/mail/?view=cm&fs=1"
    + "&to=" + encodeURIComponent(to)
    + "&su=" + encodeURIComponent(subject || "")
    + "&body=" + encodeURIComponent(body || "")
    + "&authuser=" + encodeURIComponent(FROM);
}
function linkedinUrl(p){
  const q = p.name ? p.name + " " + p.company : p.company;
  return "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(q);
}
function alumUrl(p){
  return "https://www.linkedin.com/search/results/people/?keywords="
    + encodeURIComponent(p.company + " University of British Columbia");
}

/* Fill a template from what the store already knows about this person. */
function buildMsg(key, p, st){
  const fn = T[key];
  if (!fn) return null;
  return fn({
    first: p.first,
    company: p.company,
    fact: p.fact,
    topic: p.ask,
    team: p.repo || (p.what ? "the product" : ""),
    role: p.mentionsIntern ? "internship" : "",
    visa: p.tier === "tier_3_us_onsite",
    said: (st && st.said) || "",
    link: (st && st.link) || "",
  });
}

/* ============================ today ============================ */

function Today({people, state, upd, setTab}){
  const [extra, setExtra] = useState(0);
  const target = (state.target || 2) + extra;

  const buckets = useMemo(() => {
    const b = {followup:[], after:[], fresh:[], close:[], waiting:0, live:0};
    people.forEach(p => {
      const st = state.p[p.id];
      const a = nextAction(p, st);
      const s = (st && st.status) || "not contacted";
      if (s !== "not contacted" && s !== "dead") b.live++;
      if (a.kind === "followup") b.followup.push(p);
      else if (a.kind === "thanks" || a.kind === "return" || a.kind === "reply") b.after.push(p);
      else if (a.kind === "wait") b.waiting++;
      else if (a.dead) b.close.push(p);
      else if (s === "not contacted" || s === "applied") b.fresh.push(p);
    });
    return b;
  }, [people, state]);

  const queue = buckets.fresh.slice(0, target);
  const nothing = !buckets.followup.length && !buckets.after.length && !buckets.close.length && !queue.length;

  return (
    <div>
      <div className="grid">
        <div className="stat"><div className="n">{buckets.followup.length}</div><div className="xs">follow up</div></div>
        <div className="stat"><div className="n">{queue.length}</div><div className="xs">to send</div></div>
        <div className="stat"><div className="n">{buckets.waiting}</div><div className="xs">waiting</div></div>
        <div className="stat"><div className="n">{buckets.live}</div><div className="xs">live threads</div></div>
      </div>

      {!STORAGE_OK && <div className="warn stop">
        <b>This browser is blocking local storage.</b> Nothing you mark will be saved.
        Private windows do this. Open the page in a normal window.
      </div>}

      {nothing && (
        <div className="card">
          <h3>Nothing due.</h3>
          <p className="dim sm">
            {buckets.waiting > 0
              ? buckets.waiting + " threads are inside the 7-day window. Nothing to do but wait."
              : "You're through the list."}
          </p>
          <button className="tiny" onClick={() => setExtra(extra + 2)}>Queue two more anyway</button>
        </div>
      )}

      {buckets.followup.length > 0 && (
        <React.Fragment>
          <h2>Follow up first</h2>
          <p className="sm dim" style={{marginTop:-4}}>
            Seven days, no reply. One follow-up, never two. The card says which channel you used.
          </p>
          {buckets.followup.map(p => <PersonCard key={p.id} p={p} st={state.p[p.id]} upd={upd} />)}
        </React.Fragment>
      )}

      {buckets.after.length > 0 && (
        <React.Fragment>
          <h2>Live threads</h2>
          {buckets.after.map(p => <PersonCard key={p.id} p={p} st={state.p[p.id]} upd={upd} />)}
        </React.Fragment>
      )}

      {buckets.close.length > 0 && (
        <React.Fragment>
          <h2>Close these out</h2>
          <p className="sm dim" style={{marginTop:-4}}>
            Two touches, no reply. That is the rule, and leaving them open is how the list stops
            meaning anything.
          </p>
          {buckets.close.map(p => (
            <div className="card" key={p.id}>
              <div className="row" style={{justifyContent:"space-between", alignItems:"center"}}>
                <div>
                  <b>{p.name || p.company}</b>
                  <div className="sm dim">{p.company} · {CHANNELS[(state.p[p.id]||{}).channel || "email"]} · {ago((state.p[p.id]||{}).last)}</div>
                </div>
                <button className="tiny" onClick={() => upd(p.id, {status:"dead"})}>Mark dead</button>
              </div>
            </div>
          ))}
        </React.Fragment>
      )}

      {queue.length > 0 && (
        <React.Fragment>
          <h2>Send today</h2>
          <p className="sm dim" style={{marginTop:-4}}>
            Cap is two a day. The floor is one. Never miss two days in a row.
          </p>
          {queue.map(p => <PersonCard key={p.id} p={p} st={state.p[p.id]} upd={upd} />)}
          <button className="tiny ghost" onClick={() => setExtra(extra + 1)}>One more</button>
        </React.Fragment>
      )}
    </div>
  );
}

/* ============================ people ============================ */

const FILTERS = [
  ["due",  "Follow up"],
  ["live", "In play"],
  ["new",  "Not contacted"],
  ["all",  "All"],
  ["dead", "Dead"],
];

function People({people, state, upd}){
  const [q, setQ] = useState("");
  const [f, setF] = useState("due");
  const [open, setOpen] = useState(null);

  const rows = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return people.filter(p => {
      const st = state.p[p.id];
      const s = (st && st.status) || "not contacted";
      const a = nextAction(p, st);
      if (f === "due"  && a.kind !== "followup" && a.kind !== "thanks" && a.kind !== "return" && a.kind !== "reply") return false;
      if (f === "live" && (s === "not contacted" || s === "dead")) return false;
      if (f === "new"  && s !== "not contacted") return false;
      if (f === "dead" && s !== "dead") return false;
      if (!needle) return true;
      return (p.company + " " + (p.name || "") + " " + p.email + " " + (p.domain || "")).toLowerCase().includes(needle);
    });
  }, [people, state, q, f]);

  const counts = useMemo(() => {
    const c = {};
    STATUSES.forEach(s => c[s] = 0);
    let due = 0;
    people.forEach(p => {
      const st = state.p[p.id];
      c[(st && st.status) || "not contacted"]++;
      if (nextAction(p, st).kind === "followup") due++;
    });
    c.due = due;
    return c;
  }, [people, state]);

  return (
    <div>
      <div className="grid">
        <div className="stat"><div className="n">{counts.messaged}</div><div className="xs">messaged</div></div>
        <div className="stat"><div className="n">{counts.replied + counts["call booked"] + counts["call done"]}</div><div className="xs">replied</div></div>
        <div className="stat"><div className="n">{counts.due}</div><div className="xs">follow up due</div></div>
        <div className="stat"><div className="n">{counts["not contacted"]}</div><div className="xs">untouched</div></div>
      </div>

      <input type="text" placeholder="Search name, company, address" value={q}
             onChange={e => setQ(e.target.value)} style={{marginBottom:9}} />
      <div className="row" style={{marginBottom:12}}>
        {FILTERS.map(([k, label]) =>
          <button key={k} className={"tiny" + (f === k ? " sel" : "")} onClick={() => setF(k)}>
            {label}{k === "due" && counts.due ? " " + counts.due : ""}
          </button>)}
      </div>

      {rows.length === 0 && <div className="card sm dim">Nothing here.</div>}

      {rows.length > 0 && (
      <div className="card" style={{padding:"6px 14px"}}>
        <table>
          <thead><tr>
            <th>Who</th><th>Status</th><th>Where</th><th>Last</th>
          </tr></thead>
          <tbody>
            {rows.map(p => {
              const st = state.p[p.id] || {};
              const a = nextAction(p, st);
              const isOpen = open === p.id;
              return (
                <React.Fragment key={p.id}>
                  <tr>
                    <td onClick={() => setOpen(isOpen ? null : p.id)} style={{cursor:"pointer"}}>
                      <b>{p.name || p.company}</b>
                      {p.name && <div className="dim" style={{fontSize:12}}>{p.company}</div>}
                      {a.kind === "followup" && <span className="pill t3" style={{marginTop:3, display:"inline-block"}}>follow up</span>}
                    </td>
                    <td>
                      <select value={st.status || "not contacted"}
                        onChange={e => upd(p.id, {status:e.target.value, last:today(),
                                                 first:st.first || today(),
                                                 channel:st.channel || "email"})}>
                        {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                    <td className="sm">
                      {st.status && st.status !== "not contacted"
                        ? <select value={st.channel || "email"} onChange={e => upd(p.id, {channel:e.target.value})}>
                            {Object.keys(CHANNELS).map(c => <option key={c} value={c}>{CHANNELS[c]}</option>)}
                          </select>
                        : <span className="dim">-</span>}
                    </td>
                    <td className="sm dim">{st.last ? ago(st.last) : "-"}</td>
                  </tr>
                  {isOpen && (
                    <tr><td colSpan="4" className="detail">
                      <div className="sm" style={{marginBottom:6}}>
                        <b>{a.label}.</b> <span className="dim">{a.why}</span>
                      </div>
                      <div className="sm dim" style={{marginBottom:6}}>
                        {p.email} · <a href={"https://" + p.domain} target="_blank" rel="noopener">{p.domain}</a>
                        {p.repo && <span> · <a href={"https://github.com/" + p.repo} target="_blank" rel="noopener">{p.repo}</a></span>}
                        {p.postingUrl && <span> · <a href={p.postingUrl} target="_blank" rel="noopener">posting</a></span>}
                      </div>
                      {p.what && <div className="sm" style={{marginBottom:6}}>{p.what}</div>}
                      <textarea placeholder="Notes - what they said, when the call is, what you promised"
                        value={st.notes || ""} onChange={e => upd(p.id, {notes:e.target.value})} />
                      <div className="row" style={{marginTop:7}}>
                        <button className="tiny" onClick={() => copy(p.email, "Address copied")}>Copy address</button>
                        <a href={linkedinUrl(p)} target="_blank" rel="noopener"><button className="tiny">LinkedIn</button></a>
                      </div>
                    </td></tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>)}
    </div>
  );
}

/* ============================ process ============================ */

const FLOW = [
  ["Sources pull companies", true,
   "HN 'Who is hiring' once a month, The Next Play every week. Both are just job postings scraped into one file. Nothing here knows about people yet."],
  ["Enrich fills in the company", true,
   "What they build, where they are, remote policy, and the work-authorisation tier: Canada, remote-US, or US onsite. Runs Monday mornings."],
  ["Find a human at that company", true,
   "Two ways, both automatic, both verified. Read the commit authors on their public GitHub repos, or take an address the posting printed itself. This is the step that turns a company into a person. It never guesses an address."],
  ["Research one real fact", false,
   "You, five minutes, per person. Open their repo or their blog and find one specific true thing. This is the only step that decides whether the message reads as a person or as a mail merge, and it is the step that is actually short-staffed: 8 of 188."],
  ["Send it", false,
   "You, by hand, one a day, two maximum. Nothing in this system has ever sent an email and nothing in it will."],
  ["Follow up on day 7", false,
   "Once. Never twice. The app raises the flag on its own and tells you which channel you used. Two unanswered touches means dead."],
  ["Call, then the loop that actually works", false,
   "Thank-you inside 24 hours repeating what they said. Build the thing they told you to build. Two weeks later, send it. That last message is where referrals come from, and almost nobody sends it."],
];

function Process({people, state, counts, setRope}){
  const done = state.ropes || {};
  const n = Object.keys(done).filter(k => done[k]).length;
  const researched = people.filter(p => p.fact).length;
  const named = people.filter(p => p.name).length;
  const sent = people.filter(p => {
    const s = state.p[p.id];
    return s && s.status && s.status !== "not contacted";
  }).length;

  return (
    <div>
      <h2 style={{marginTop:0}}>What this actually is</h2>
      <div className="card">
        <p className="sm">
          The store holds <b>companies</b>, not founders. {counts.companies} of them.
          A company becomes contactable only when step 3 finds a human attached to it, and
          right now {counts.people} have one.
        </p>
        <p className="sm" style={{marginBottom:0}}>
          Of those: <b>{named} are named people</b> found through commit authorship on the
          company's own repos, which at a ten-person startup is usually an engineer and often
          the founder. The rest are addresses the job posting printed - typically the founder
          or whoever is doing the hiring - and a handful are role inboxes like jobs@, which are
          not a person at all and should be treated as an application, not a conversation.
        </p>
      </div>

      <h2>Who you contact, and in what order</h2>
      <div className="card">
        <p className="sm"><b>Engineer or founder first. Recruiter last, and only warm.</b></p>
        <p className="sm dim" style={{marginBottom:0}}>
          A cold message from a student is noise in a recruiter's stack of four hundred. The same
          message to an engineer, asking a specific question about a commit they wrote last week,
          is a conversation. And the referral comes from the engineer, not the recruiter - which
          is why template 7 is locked behind having an engineer's name to put in the first line.
        </p>
      </div>

      <h2>The pipeline, end to end</h2>
      <ol className="flow">
        {FLOW.map(([h, auto, body], i) =>
          <li key={i} className={auto ? "" : "man"}>
            <h3 style={{display:"inline"}}>{h}</h3>
            <span className={"tag" + (auto ? "" : " man")}>{auto ? "automatic" : "you"}</span>
            <p className="sm dim" style={{marginTop:5, marginBottom:0}}>{body}</p>
          </li>
        )}
      </ol>

      <div className="warn">
        <b>Everything above step 4 is already built and running on a schedule.</b> The four
        automatic steps have produced {counts.people} contactable people and{" "}
        {counts.unworked} more companies waiting for a contact. The manual steps have
        produced <b>{sent} sent</b>. That ratio is the whole problem, and no amount of further
        automation moves it.
      </div>

      <h2>The first two weeks</h2>
      <p className="sm dim" style={{marginTop:-4}}>
        {n} of {ROPES.length} done. One per day. They get easier and they are in this order for a reason.
      </p>
      <div className="card">
        {ROPES.map(([h, body], i) =>
          <div key={i} className={"chk" + (done[i] ? " on" : "")} onClick={() => setRope(i, !done[i])}>
            <div className={"box" + (done[i] ? " on" : "")}>✓</div>
            <div className="ct">
              <b className="sm">Day {i+1}. {h}</b>
              <div className="sm dim">{body}</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================ templates ============================ */

function Templates(){
  const [path, setPath] = useState(["start"]);
  const node = path[path.length - 1];

  if (LEAF[node] || STOP[node]){
    const stop = STOP[node];
    const msg = LEAF[node] ? buildMsg(LEAF[node], {}, null) : null;
    return (
      <div>
        <button className="tiny ghost" onClick={() => setPath(path.slice(0, -1))}>← back</button>
        <button className="tiny ghost" onClick={() => setPath(["start"])}>start over</button>
        {stop ? (
          <div className="card" style={{marginTop:10}}>
            <div className="warn stop" style={{marginBottom:0}}>
              <h3>{stop.h}</h3>
              <p className="sm" style={{marginBottom:0}}>{stop.p}</p>
            </div>
          </div>
        ) : (
          <div className="card" style={{marginTop:10}}>
            <h3>Template {msg.n} — {msg.name}</h3>
            <p className="sm dim">{msg.note}</p>
            {msg.subject && <div className="sm" style={{marginBottom:6}}><b>Subject:</b> {msg.subject}</div>}
            <pre>{msg.text}</pre>
            <CopyBtn text={msg.text} />
            <p className="sm dim" style={{marginTop:9, marginBottom:0}}>
              Blank template. Use the Today tab instead when you want it filled in with a real
              person's name and fact.
            </p>
          </div>
        )}
      </div>
    );
  }

  const t = TREE[node];
  return (
    <div>
      {path.length > 1 && <button className="tiny ghost" onClick={() => setPath(path.slice(0, -1))}>← back</button>}
      <div className="card">
        <h3>{t.q}</h3>
        <div style={{marginTop:12}}>
          {t.a.map(([label, next]) =>
            <button key={next} className="go" style={{marginBottom:8, fontSize:15}}
              onClick={() => setPath(path.concat([next]))}>{label}</button>
          )}
        </div>
      </div>
      <p className="sm dim">
        Three of these paths end in "don't send anything yet". That is deliberate. The message you
        don't send costs you nothing; the wrong one spends the contact.
      </p>
    </div>
  );
}

/* ============================ app ============================ */

const TABS = [["today","Today"],["people","People"],["process","Process"],["templates","Templates"]];

function App(){
  const [tab, setTab] = useState("today");
  const [state, setState] = useState(loadState);
  const [theme, setTheme] = useState(loadTheme);
  const file = useRef(null);

  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => { applyTheme(theme); }, [theme]);

  /* Two ways in. Locally, data.js ships alongside the page. On a published copy
     there is no data.js - you import the export file, which carries the people
     as well as the progress, so no one's address is ever on a public URL. */
  const people = (state.people && state.people.length) ? state.people : window.SEED.people;
  const counts = state.counts || window.SEED.counts;

  /* Person state is merged, never replaced, so a data.js refresh that adds new
     people cannot wipe what you have already tracked. */
  function upd(id, patch){
    setState(s => Object.assign({}, s, {
      p: Object.assign({}, s.p, {[id]: Object.assign({}, s.p[id], patch)}),
      log: (patch.status === "messaged")
        ? (s.log || []).concat([{id:id, at:new Date().toISOString(), ch:patch.channel}])
        : (s.log || []),
    }));
  }
  function setRope(i, on){
    setState(s => Object.assign({}, s, {ropes: Object.assign({}, s.ropes, {[i]: on})}));
  }

  function exportState(){
    const out = Object.assign({}, state, {people: people, counts: counts, generated: window.SEED.generated});
    const blob = new Blob([JSON.stringify(out, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "outreach-" + today() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function importState(ev){
    const f = ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const incoming = JSON.parse(r.result);
      if (!incoming || typeof incoming.p !== "object") { toast("Not an outreach export"); return; }
      setState(incoming);
      toast("Loaded " + (incoming.people || []).length + " people, "
            + Object.keys(incoming.p).length + " tracked");
    };
    r.readAsText(f);
  }

  const sent = (state.log || []).length;

  return (
    <React.Fragment>
      <div className="head">
        <div>
          <h1>Outreach</h1>
          <div className="sm dim">
            {sent === 0
              ? "Zero sent. That is still the only number that matters."
              : sent + " sent since you started. Keep the streak."}
          </div>
        </div>
        <button className="theme" title={"Theme: " + theme}
          onClick={() => setTheme(theme === "auto" ? "dark" : theme === "dark" ? "light" : "auto")}>
          {theme === "auto" ? "◐" : theme === "dark" ? "☾" : "☀"}
        </button>
      </div>

      <div className="tabs">
        {TABS.map(([k, label]) =>
          <button key={k} className={tab === k ? "on" : ""} onClick={() => setTab(k)}>{label}</button>)}
      </div>

      {people.length === 0 ? (
        <div className="card">
          <h3>No data loaded.</h3>
          <p className="sm dim">
            This copy is published without contact data on purpose - it would put 188 real
            people's addresses on a public URL. Export from the machine that has the pipeline,
            then Import the file here. It carries the people and your progress together.
          </p>
          <button className="tiny" onClick={() => file.current.click()}>Import a data file</button>
          <input ref={file} type="file" accept="application/json" style={{display:"none"}} onChange={importState} />
        </div>
      ) : (
      <React.Fragment>
      {tab === "today"     && <Today people={people} state={state} upd={upd} setTab={setTab} />}
      {tab === "people"    && <People people={people} state={state} upd={upd} />}
      {tab === "process"   && <Process people={people} state={state} counts={counts} setRope={setRope} />}
      {tab === "templates" && <Templates />}
      </React.Fragment>
      )}

      <div className="foot">
        <div className="row" style={{marginBottom:8}}>
          <button className="tiny ghost" onClick={exportState}>Export progress</button>
          <button className="tiny ghost" onClick={() => file.current.click()}>Import</button>
          <input ref={file} type="file" accept="application/json" style={{display:"none"}} onChange={importState} />
        </div>
        {counts.people} people from {counts.companies} companies,
        data generated {state.generated || window.SEED.generated}. Progress is saved in this browser only -
        export it before you switch machines.
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
