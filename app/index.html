<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe9f2">
<!-- Tells the browser the page handles both, so native controls - selects,
     scrollbars, form widgets - are drawn in the matching scheme instead of
     always light. The app itself follows the OS by default; the toggle in the
     header only overrides it. -->
<meta name="color-scheme" content="light dark">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="description" content="A job-search pipeline that finds a real human at a hiring company, drafts one message, and refuses to send it for you.">
<title>Outreach</title>
<!-- Real data first. It is gitignored, so on a published copy this 404s and the
     example set below fills in - data.example.js only assigns if SEED is unset.
     Plain scripts rather than fetch(), because the built copy has to work from
     file:// as well as from Pages, and fetch() fails on the first. Both live in
     public/, so Vite copies them to the output root untouched. -->
<script src="./data.js" onerror="this.dataset.missing=1"></script>
<script src="./data.example.js"></script>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
